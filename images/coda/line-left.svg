<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 260" width="100" height="260"
     preserveAspectRatio="none" role="presentation" aria-hidden="true">
  <!-- one crimson line, climbing away from the corner. the stroke is held at a
       constant width so the panel can stretch without thickening it. -->
  <path d="M3 250 C 9 184 28 120 58 78 C 74 54 88 30 97 8"
        fill="none" stroke="#D51C39" stroke-width="1.4" stroke-opacity="0.85"
        stroke-linecap="round" vector-effect="non-scaling-stroke"/>
</svg>
