<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 520" width="240" height="520"
     role="presentation" aria-hidden="true">
  <defs>
    <filter id="r-tooth" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer result="grain"><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="inside"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inside"/></feMerge>
    </filter>
  </defs>

  <!-- everything runs off the right edge and stops short of the other three -->
  <g filter="url(#r-tooth)">
    <!-- a paler mass up top -->
    <circle cx="272" cy="174" r="188" fill="#FFF0E4"/>

    <!-- the burgundy sweep, as on the cover -->
    <path d="M242 150 C 160 194 104 276 80 358 C 60 424 96 492 178 514
             C 196 518 222 519 242 519 Z"
          fill="#760031"/>

    <!-- the same crimson line, arriving -->
    <path d="M2 486 C 58 428 106 358 144 284 C 178 218 212 138 240 60"
          fill="none" stroke="#D51C39" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
