<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 260" width="100" height="260"
     preserveAspectRatio="none" role="presentation" aria-hidden="true">
  <!-- one crimson line, out of the footer and up the gutter. the stroke is held
       at a constant width so the panel can stretch without thickening it. -->
