<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <clipPath id="board"><rect width="280" height="320"/></clipPath>
    <!-- a little tooth in the paper, barely there -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <g clip-path="url(#board)">
    <rect width="280" height="320" fill="#E9E6DF"/>

    <!-- sand, running off the top-left corner -->
    <circle cx="20" cy="6" r="96" fill="#BFAF94"/>

    <!-- the dark sweep in the bottom-right -->
    <path d="M280 182 C 246 196 222 232 206 268 C 196 292 190 308 187 320 L 280 320 Z"
          fill="#2F3A36"/>

    <!-- one gold line, following it at a distance -->
    <path d="M18 320 C 66 296 100 268 140 236 C 184 200 232 176 280 162"
          fill="none" stroke="#C0A26A" stroke-width="1.6" stroke-linecap="round"/>

    <rect width="280" height="320" filter="url(#grain)" opacity="0.55"/>
  </g>
</svg>
